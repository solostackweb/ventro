name: Scheduled Ingestion Pipeline

on:
  schedule:
    # Hourly job picks up hourly sources, plus daily/weekly at 02:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Pipeline type to run'
        type: choice
        options:
          - news_ingestion
          - funding_extraction
          - thesis_extraction
          - pattern_detection
          - entity_sync
          - full_refresh
        default: news_ingestion
      source_scope:
        description: 'Source scope (optional filter)'
        type: string
        required: false
      max_stages:
        description: 'Max stages to process per workflow run'
        type: string
        default: '10'

concurrency:
  group: scheduled-ingestion-${{ github.event.inputs.pipeline_type || 'news_ingestion' }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # A cold full refresh uploads and persists thousands of source documents.
    # Subsequent runs are faster, but the bootstrap must have enough headroom.
    timeout-minutes: 60
    
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      # API keys for gap-fill sources (optional)
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline worker
        run: |
          PIPELINE_TYPE="${{ github.event.inputs.pipeline_type || 'news_ingestion' }}"
          SOURCE_SCOPE="${{ github.event.inputs.source_scope || '' }}"
          MAX_STAGES="${{ github.event.inputs.max_stages || '10' }}"
          ARGS=(--type="$PIPELINE_TYPE" --max-stages="$MAX_STAGES")
          if [ -n "$SOURCE_SCOPE" ]; then ARGS+=(--scope="$SOURCE_SCOPE"); fi
          npm run pipeline:worker -- "${ARGS[@]}"

      - name: Run daily entity, thesis, and pattern intelligence
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +'%H')" = "02" ]; then
            npm run pipeline:worker -- --once --type=entity_sync --max-stages=1
            npm run pipeline:worker -- --once --type=funding_extraction --max-stages=4
            npm run pipeline:worker -- --once --type=thesis_extraction --max-stages=2
            npm run pipeline:worker -- --once --type=pattern_detection --max-stages=1
          fi

      - name: Refresh 90-day intelligence answers
        run: |
          PERIOD_END="$(date -u +'%Y-%m-%dT00:00:00Z')"
          PERIOD_START="$(date -u -d '90 days ago' +'%Y-%m-%dT00:00:00Z')"
          npm run answers:compute -- --period-start="$PERIOD_START" --period-end="$PERIOD_END"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
          retention-days: 7
