name: Scheduled Ingestion Pipeline

on:
  schedule:
    # Hourly job picks up hourly sources, plus daily/weekly at 02:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Pipeline type to run'
        type: choice
        options:
          - news_ingestion
          - funding_extraction
          - thesis_extraction
          - pattern_detection
          - full_refresh
        default: news_ingestion
      source_scope:
        description: 'Source scope (optional filter)'
        type: string
        required: false
      max_stages:
        description: 'Max stages to process per workflow run'
        type: string
        default: '10'

concurrency:
  group: scheduled-ingestion-${{ github.event.inputs.pipeline_type || 'news_ingestion' }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      # API keys for gap-fill sources (optional)
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline worker
        run: |
          PIPELINE_TYPE="${{ github.event.inputs.pipeline_type || 'news_ingestion' }}"
          SOURCE_SCOPE="${{ github.event.inputs.source_scope || '' }}"
          MAX_STAGES="${{ github.event.inputs.max_stages || '10' }}"
          npm run pipeline:worker -- --type="$PIPELINE_TYPE" --scope="$SOURCE_SCOPE" --max-stages="$MAX_STAGES"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
          retention-days: 7